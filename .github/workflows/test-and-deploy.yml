name: Run tests, and deploy to GitHub pages from main

on:
  push:
  pull_request:

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 🔧
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install, run unit tests and type-check 🔧
        run: |
          npm ci
          npm run test:unit
          npm run build

  deploy-gh-pages:
    needs: run-unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apply local settings
        uses: finnp/create-file-action@ba7436058fbdd9579be2f36fcfb1b0ed1e692ab8 # master
        env:
          FILE_NAME: ".env.local"
          FILE_DATA: 'URL_PREFIX = "/crow/"'

      - name: Setup Node 🔧
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install and build 🔧
        run: |
          npm ci
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@049a95c516cd5723d8cfde79dc7a79fcdcbd6c97 # 4.0.0
        with:
          branch: gh-pages
          folder: docs
