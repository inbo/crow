version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # No routine version-update PRs: dependencies are updated by hand (see README).
    # Security updates still come through, grouped into a single PR.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
